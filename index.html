<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Marvel Cinematic Universe films information in chronological order"
    />
    <!--
      Typekit (rift, for h1/h2 and the season numerals). Keep this here rather
      than as an @import in index.scss: an @import is only discovered once the
      importing file has been fetched and parsed, which serializes the two
      requests. The app renders on `window load` (App.tsx), so that extra round
      trip delays first content directly.
    -->
    <link rel="preconnect" href="https://use.typekit.net" crossorigin />
    <link rel="stylesheet" href="https://use.typekit.net/ncb2bkr.css" />
    <title>Am See You</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
