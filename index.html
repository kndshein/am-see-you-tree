<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Marvel Cinematic Universe films information in chronological order"
    />
    <!--
      Typekit (rift, for h1/h2 and the season numerals). Keep this here rather
      than as an @import in index.scss: an @import is only discovered once the
      importing file has been fetched and parsed, which serializes the two
      requests. The app renders on `window load` (App.tsx), so that extra round
      trip delays first content directly.
    -->
    <link rel="preconnect" href="https://use.typekit.net" crossorigin />
    <link rel="stylesheet" href="https://use.typekit.net/ncb2bkr.css" />
    <title>Am See You</title>
    <script>
      // Chromium (Chrome, Edge, Opera, ...) loses track of whether an element
      // is still "relevant to the user" when it has content-visibility: auto
      // and also gets a JS-driven `transform` every frame (MediaList.tsx's
      // rail curve) — cards intermittently go invisible depending on mouse
      // position. Firefox/Safari don't share this bug, so content-visibility
      // (index.scss's .media — it fixes a real horizontal-scroll jitter)
      // stays everywhere else; Chromium alone gets it turned back off. Runs
      // synchronously in <head>, before first paint, so there's no flash of
      // the wrong behavior.
      document.documentElement.classList.toggle(
        'is-chromium',
        /Chrome|Chromium|CriOS/.test(navigator.userAgent) &&
          !/Firefox|FxiOS/.test(navigator.userAgent)
      );
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
